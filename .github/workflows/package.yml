name: Package app

# Builds a double-clickable MyMole.app for both architectures and, when a tag
# is given, attaches the archives to a GitHub release.
#
# What this workflow deliberately does not do: it runs no test suite (CI does
# that) and it does not notarize. It builds and packages only.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version written into Info.plist and the archive names
        default: "1.0"
        required: true
      release_tag:
        description: Tag to publish as a release (empty builds artifacts only)
        default: ""
        required: false
  push:
    tags:
      - "v*"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  package:
    name: ${{ matrix.arch }}
    runs-on: macos-26
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # The runner is Apple silicon, so arm64 is native and x86_64 is a
          # cross build. Both triples carry their own deployment target: the
          # package runs on macOS 14.4 and later.
          - arch: arm64
            triple: arm64-apple-macosx14.4
          - arch: x86_64
            triple: x86_64-apple-macosx14.4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version
          # SwiftPM needs 6.2 for this manifest; anything older fails earlier
          # with a confusing parse error, so say it plainly here.
          swift --version | head -1 | grep -qE 'Swift version 6\.[2-9]' \
            || { echo "Swift 6.2 or newer is required" >&2; exit 1; }

      - name: Build (${{ matrix.arch }})
        run: |
          set -euo pipefail
          swift build -c release --triple "${{ matrix.triple }}" --product MyMoleHelper
          swift build -c release --triple "${{ matrix.triple }}" --product MyMole

      - name: Package (${{ matrix.arch }})
        env:
          # Empty on a tag push, which is why the script defaults it.
          VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          version="${VERSION:-1.0}"
          bin="$(swift build -c release --triple "${{ matrix.triple }}" --show-bin-path)"
          scripts/package-app.sh "$bin" "${{ matrix.arch }}" dist "$version"
          echo "--- what was produced ---"
          ls -lh dist
          lipo -archs dist/MyMole.app/Contents/MacOS/MyMole
          lipo -archs dist/MyMole.app/Contents/MacOS/MyMoleHelper
          vtool -show-build dist/MyMole.app/Contents/MacOS/MyMole | sed -n '1,12p'

      - name: Refuse a bundle that claims another architecture
        run: |
          set -euo pipefail
          if ! lipo -archs dist/MyMole.app/Contents/MacOS/MyMole \
             | tr ' ' '\n' | grep -qx "${{ matrix.arch }}"; then
            echo "bundle is not ${{ matrix.arch }}" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MyMole-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.dmg
          if-no-files-found: error
          retention-days: 14

  release:
    # Only a person who names a tag gets a release; a tag push means the same.
    if: github.event_name == 'push' || github.event.inputs.release_tag != ''
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PUSHED_TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-}"
          [ -n "$tag" ] || tag="$PUSHED_TAG"
          ls -lh dist
          # A release that already exists is added to, not recreated; the
          # assets are replaced so a rerun after a fix is not a dead end.
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" dist/*.zip dist/*.dmg --clobber
          else
            gh release create "$tag" dist/*.zip dist/*.dmg \
              --title "MyMole $tag" \
              --notes "Built from ${SHA:0:7}. arm64 for Apple silicon, x86_64 for Intel; both need macOS 14.4 or later. Ad hoc signed and not notarized, so the first launch needs System Settings > Privacy & Security > Open Anyway."
          fi

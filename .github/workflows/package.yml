name: Package app

# Builds a double-clickable MyMole.app for both architectures, merges them into
# one universal bundle and, when a tag is given, attaches the disk image to a
# GitHub release.
#
# One runner does both builds in turn: each is a full release build, and a
# matrix would take two hosted machines to produce one file. The two products
# are merged with lipo, so the release carries a single dmg that runs on Apple
# silicon and on Intel.
#
# What this workflow deliberately does not do: it runs no test suite (CI does
# that) and it does not notarize. It builds and packages only.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version written into Info.plist and the archive name
        default: "1.0"
        required: true
      release_tag:
        description: Tag to publish as a release (empty builds artifacts only)
        default: ""
        required: false
  push:
    tags:
      - "v*"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  package:
    name: universal
    runs-on: macos-26
    # Two release builds in one job, one per architecture.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          version="$(swift --version)"
          printf '%s\n' "$version"
          # SwiftPM needs 6.2 for this manifest; anything older fails earlier
          # with a confusing parse error, so say it plainly here. The whole
          # output is matched: grep -q would close the pipe early and pipefail
          # would then report a match as a failure.
          printf '%s\n' "$version" | grep -E 'Swift version 6\.[2-9]' \
            || { echo "Swift 6.2 or newer is required" >&2; exit 1; }

      - name: Build both architectures
        run: |
          set -euo pipefail
          # The runner is Apple silicon, so arm64 is native and x86_64 is a
          # cross build. Both triples carry their own deployment target: the
          # package runs on macOS 14.4 and later.
          for triple in arm64-apple-macosx14.4 x86_64-apple-macosx14.4; do
            swift build -c release --triple "$triple" --product MyMoleHelper
            swift build -c release --triple "$triple" --product MyMole
          done

      - name: Merge them into one bundle's worth of binaries
        run: |
          set -euo pipefail
          arm="$(swift build -c release --triple arm64-apple-macosx14.4 --show-bin-path)"
          intel="$(swift build -c release --triple x86_64-apple-macosx14.4 --show-bin-path)"
          mkdir -p dist-bin
          for product in MyMole MyMoleHelper; do
            lipo -create "$arm/$product" "$intel/$product" -output "dist-bin/$product"
            chmod +x "dist-bin/$product"
            echo "$product: $(lipo -archs "dist-bin/$product")"
          done

      - name: Package
        env:
          # Empty on a tag push, where the tag names the version instead.
          VERSION: ${{ github.event.inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          # The release carries the disk image alone.
          MYMOLE_ARCHIVE: dmg
        run: |
          set -euo pipefail
          version="${VERSION:-1.0}"
          # A tag push carries no inputs, so v1.1 is version 1.1 rather than the
          # default: the archive would otherwise say 1.0 beside a v1.1 release.
          if [ -z "${VERSION:-}" ] && [ "$REF_TYPE" = tag ]; then
            version="${REF_NAME#v}"
          fi
          scripts/package-app.sh dist-bin universal dist "$version"
          echo "--- what was produced ---"
          ls -lh dist
          lipo -archs dist/MyMole.app/Contents/MacOS/MyMole
          lipo -archs dist/MyMole.app/Contents/MacOS/MyMoleHelper
          vtool -show-build dist/MyMole.app/Contents/MacOS/MyMole | sed -n '1,12p'
          echo "--- languages in the bundle ---"
          ls -d dist/MyMole.app/Contents/Resources/*.lproj | sed 's|.*/||' | tr '\n' ' '
          echo

      - name: Refuse a bundle that claims an architecture it lacks
        run: |
          set -euo pipefail
          for binary in MyMole MyMoleHelper; do
            arches="$(lipo -archs "dist/MyMole.app/Contents/MacOS/$binary")"
            for want in arm64 x86_64; do
              case " $arches " in
                *" $want "*) echo "$binary: $arches" ;;
                *) echo "$binary is [$arches], missing $want" >&2; exit 1 ;;
              esac
            done
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MyMole-universal
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 14

  release:
    # Only a person who names a tag gets a release; a tag push means the same.
    if: github.event_name == 'push' || github.event.inputs.release_tag != ''
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # merge-multiple drops the artifact's own folder, so the dmg lands in
      # dist/ rather than dist/<artifact>/; without it the glob below matches
      # nothing.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PUSHED_TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-}"
          [ -n "$tag" ] || tag="$PUSHED_TAG"
          ls -lh dist
          # One dmg, both architectures in it. A release that already exists is
          # added to, not recreated; the asset is replaced so a rerun after a
          # fix is not a dead end.
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" dist/*.dmg --clobber
          else
            gh release create "$tag" dist/*.dmg \
              --title "MyMole $tag" \
              --notes "Built from ${SHA:0:7}. One universal disk image: arm64 for Apple silicon and x86_64 for Intel, both needing macOS 14.4 or later. Ad hoc signed and not notarized, so the first launch needs System Settings > Privacy & Security > Open Anyway."
          fi
